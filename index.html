<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shweta Jadhav | Graphic Designer</title>
    <meta name="description" content="Shweta Jadhav - Professional Graphic Designer specializing in logo design, branding, and print materials. Based in Pune, Maharashtra.">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- v3 Redesign CSS -->
    <link rel="stylesheet" href="css/v3-redesign.css">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <!-- Top Navigation -->
    <nav class="v3-navbar">
        <div class="v3-nav-container">
            <a href="index.html" class="v3-logo">
                <img src="img/logo/logo2.png" alt="Logo" style="filter: brightness(0) invert(1);"> <span>.</span>
            </a>
            
            <ul class="v3-nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="v3-social-nav">
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://www.behance.net/shwetajadhav11" target="_blank"><i class="fab fa-behance"></i></a>
            </div>

            <button class="v3-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="v3-main-content">
        <section class="v3-hero v3-container">
            <div class="v3-hero-grid">
                <div class="v3-hero-text">
                    <h1>Shweta <span>Jadhav</span></h1>
                    <p>A passionate Graphic Designer based in Pune, crafting visual identities that make brands unforgettable for over 6+ years.</p>
                    
                    <div class="v3-hero-btns">
                        <a href="portfolio.html" class="v3-btn">View Work</a>
                        <a href="about.html" class="v3-btn v3-btn-outline">About Me</a>
                    </div>
                </div>
                
                <div class="v3-hero-img-wrapper">
                    <img src="img/home/shweta-about-image.png" alt="Shweta Jadhav">
                </div>
            </div>
        </section>
    </main>

    <script>
        // Simple mobile menu toggle
        const toggle = document.querySelector('.v3-menu-toggle');
        const links = document.querySelector('.v3-nav-links');
        
        toggle.addEventListener('click', () => {
            if(links.style.display === 'flex') {
                links.style.display = 'none';
            } else {
                links.style.display = 'flex';
                links.style.flexDirection = 'column';
                links.style.position = 'absolute';
                links.style.top = '80px';
                links.style.left = '0';
                links.style.width = '100%';
                links.style.background = '#09090b';
                links.style.padding = '20px';
            }
        });

        // Preloader Logic
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        });
    </script>
</body>
</html>
