<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Shweta Jadhav</title>
    <meta name="description" content="Contact Shweta Jadhav - Graphic Designer.">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- v3 Redesign CSS -->
    <link rel="stylesheet" href="css/v3-redesign.css">
</head>
<body>

    <!-- Top Navigation -->
    <nav class="v3-navbar">
        <div class="v3-nav-container">
            <a href="index.html" class="v3-logo">
                <img src="img/logo/logo2.png" alt="Logo" style="filter: brightness(0) invert(1);"> <span>.</span>
            </a>
            
            <ul class="v3-nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>

            <div class="v3-social-nav">
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://www.behance.net/shwetajadhav11" target="_blank"><i class="fab fa-behance"></i></a>
            </div>

            <button class="v3-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="v3-main-content">
        <section class="v3-container">
            <div class="v3-page-header">
                <h2 class="v3-page-title">Get In <span>Touch</span></h2>
                <span class="v3-page-subtitle">Contact Me</span>
            </div>

            <div class="v3-contact-grid">
                
                <div class="v3-contact-info">
                    <p style="font-size: 18px; margin-bottom: 40px; max-width: 400px;">
                        Have a project in mind? Let's talk about how we can work together to build something great.
                    </p>

                    <div class="v3-contact-info-block">
                        <span class="v3-contact-label">Email</span>
                        <a href="mailto:Shwetanjadhav2018@gmail.com" class="v3-contact-value">Shwetanjadhav2018@gmail.com</a>
                    </div>

                    <div class="v3-contact-info-block">
                        <span class="v3-contact-label">Phone</span>
                        <a href="tel:+919307081860" class="v3-contact-value">+91 9307081860</a>
                    </div>

                    <div class="v3-contact-info-block">
                        <span class="v3-contact-label">Location</span>
                        <span class="v3-contact-value">Pune, Maharashtra</span>
                    </div>
                </div>

                <div class="v3-contact-form-container">
                    <form action="#" method="post" id="contactForm">
                        <div class="v3-form-group">
                            <input type="text" name="name" id="name" class="v3-form-control" placeholder="Your Name" required>
                        </div>
                        
                        <div class="v3-form-group">
                            <input type="email" name="email" id="email" class="v3-form-control" placeholder="Your Email" required>
                        </div>
                        
                        <div class="v3-form-group">
                            <input type="text" name="subject" id="subject" class="v3-form-control" placeholder="Subject">
                        </div>
                        
                        <div class="v3-form-group">
                            <textarea name="message" id="message" class="v3-form-control" placeholder="Your Message" required></textarea>
                        </div>
                        
                        <button type="submit" class="v3-btn" style="width: 100%;">Send Message</button>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <script>
        const toggle = document.querySelector('.v3-menu-toggle');
        const links = document.querySelector('.v3-nav-links');
        
        toggle.addEventListener('click', () => {
            if(links.style.display === 'flex') {
                links.style.display = 'none';
            } else {
                links.style.display = 'flex';
                links.style.flexDirection = 'column';
                links.style.position = 'absolute';
                links.style.top = '80px';
                links.style.left = '0';
                links.style.width = '100%';
                links.style.background = '#09090b';
                links.style.padding = '20px';
            }
        });

        // Form submission prevent default
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for reaching out! I will get back to you soon.');
            this.reset();
        });
    </script>
</body>
</html>
